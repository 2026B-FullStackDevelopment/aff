name: Deploy

on:
  push:
    branches: [main]

# A rapid sequence of pushes to the same ref should not leave stale runs
# queued — otherwise an older commit's image could finish pushing after a
# newer one and end up deployed as `latest`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Docker/GHCR repository names must be lowercase; github.repository_owner
      # preserves the org's actual casing (2026B-FullStackDevelopment), so it
      # can't be used in an image tag directly.
      - name: Compute lowercase image namespace
        run: echo "IMAGE_NAMESPACE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}/team1-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}/team1-frontend:latest

      # Separate steps so one hook failing doesn't stop bash (-e) from ever
      # reaching the other — the two services are independent.
      - name: Trigger Render backend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Trigger Render frontend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
